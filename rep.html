<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Dript · My page</title>
<!-- A rep's own page (rep-portal.ts in the agent): his stats, his leads, and his call list (calls.html?rep=1).
     Unlocked by his own code; the data comes from the Apps Script (repCalls) and holds only his numbers. -->
<style>
  :root{--bg:#f3f5f9;--surface:#fff;--ink:#16201a;--ink-2:#3d4a42;--muted:#6b7570;--line:#e3e7ee;--brand:#444ce7;--brand-soft:#eef0ff;--gain:#079455;
    --green:#079455;--green-soft:#e7f6ee;--amber:#b54708;--amber-soft:#fef3e2;--red:#b42318;--red-soft:#fdecea;--blue:#444ce7;--blue-soft:#eef0ff;--shadow:0 1px 2px rgba(16,24,40,.06)}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1218;--surface:#171b23;--ink:#e8ede9;--ink-2:#c3cbc6;--muted:#8b958f;--line:#262c37;--brand:#8b91ff;--brand-soft:#23264a;--gain:#3ccb7f;
    --green:#3ccb7f;--green-soft:#173326;--amber:#f5a524;--amber-soft:#3a2a10;--red:#f97066;--red-soft:#3b1a18;--blue:#8b91ff;--blue-soft:#23264a}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:0 16px 40px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 6px;flex-wrap:wrap}
  .brand{font-weight:800;letter-spacing:2px}.brand span{color:var(--brand)}
  .who{color:var(--muted);font-size:14px}
  nav{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
  nav button,nav a{font:inherit;font-size:14px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none}
  nav .on{background:var(--brand);border-color:var(--brand);color:#fff}
  nav a.calls{margin-left:auto;background:var(--gain);border-color:var(--gain);color:#fff;font-weight:600}
  .meta{font-size:12.5px;color:var(--muted);margin:6px 0 0}
  iframe{width:100%;border:0;display:block;min-height:600px;background:transparent}
  .gate{max-width:340px;margin:80px auto;text-align:center}
  .gate input{width:100%;font:inherit;font-size:18px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:center;margin:10px 0}
  .gate button{width:100%;font:inherit;font-weight:600;padding:12px;border-radius:12px;border:0;background:var(--brand);color:#fff;cursor:pointer}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 10px}
  .bar input,.bar select{font:inherit;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
  .bar input{flex:1;min-width:180px}
  .counts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
  .k{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
  .k b{display:block;font-size:22px}.k span{font-size:12.5px;color:var(--muted)}
  .rows{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
  .row{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:12px;padding:11px 14px;border-top:1px solid var(--line);align-items:center}
  .row:first-child{border-top:0}
  .row .d{font-size:12.5px;color:var(--muted)}
  .row .n{font-weight:600}.row .a{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .r{text-align:right}.row .p{font-weight:700;font-variant-numeric:tabular-nums}
  .tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--ink-2);margin-top:3px}
  .tag.green{background:var(--green-soft);color:var(--green)}.tag.amber{background:var(--amber-soft);color:var(--amber)}
  .tag.red{background:var(--red-soft);color:var(--red)}.tag.blue{background:var(--blue-soft);color:var(--blue)}
  .empty{padding:30px;text-align:center;color:var(--muted)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1b1f2a;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;display:none}
  @media (max-width:640px){.counts{grid-template-columns:repeat(2,minmax(0,1fr))}.row{grid-template-columns:56px minmax(0,1fr) auto}nav a.calls{margin-left:0}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const AGENT_URL = 'https://script.google.com/macros/s/AKfycbyMIYiA5qEPeFXfRgMj3Unh-bh1P6zUdZ4OL-j77nkdjcgD3kngs49trjCjI092gy-UXw/exec';
const K = { code: 'dript_rep_code', page: 'dript_rep_page', tab: 'dript_rep_tab' };
const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const money = n => n ? '$' + Math.round(n).toLocaleString('en-AU') : '—';
const fmt = d => d ? new Date(d.slice(0, 10) + 'T00:00:00Z').toLocaleDateString('en-AU', { day: 'numeric', month: 'short', timeZone: 'UTC' }) : '';
const fmtDT = s => s ? new Date(s).toLocaleString('en-AU', { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit', timeZone: 'Australia/Brisbane' }) : '';
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 2600); }

let page = load(K.page, null);
const view = { tab: load(K.tab, 'stats'), day: null, q: '', st: '' };

async function refresh(quiet) {
  if (!load(K.code, '')) return render();
  if (!quiet) toast('Loading…');
  try {
    const res = await fetch(AGENT_URL, { method: 'POST', body: JSON.stringify({ action: 'repCalls', code: load(K.code, '') }) });
    const out = await res.json();
    if (!out.ok) throw new Error(out.error || 'Rejected');
    if (!out.data) throw new Error('Nothing here yet: the office computer hasn’t sent your page');
    page = Object.assign({}, out.data, { calls: undefined });
    save(K.page, page);
    if (!quiet) toast('Up to date');
  } catch (err) {
    if (/code/i.test(String(err))) { localStorage.removeItem(K.code); page = null; toast('Wrong code'); }
    else toast(page ? 'Offline: showing the last saved page' : String(err.message || err));
  }
  render();
}

function render() {
  const app = document.getElementById('app');
  if (!load(K.code, '')) {
    app.innerHTML = `<div class="gate"><div class="brand" style="font-size:20px">DRIP<span>T</span></div>
      <p>Enter your code to open your page.</p>
      <input type="password" id="code" autocomplete="off" autocapitalize="none" placeholder="Your code" inputmode="numeric">
      <button id="go">Open</button></div>`;
    const go = () => { save(K.code, document.getElementById('code').value.trim()); refresh(false); };
    document.getElementById('go').addEventListener('click', go);
    document.getElementById('code').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    return;
  }
  if (!page) { app.innerHTML = '<div class="empty">Loading…</div>'; return; }
  const name = (page.rep && page.rep.name) || 'You';
  app.innerHTML = `
    <header><div class="brand">DRIP<span>T</span></div><div class="who">${esc(name)} · <a href="#" id="out" style="color:var(--muted)">sign out</a></div></header>
    <nav><button data-tab="stats" class="${view.tab === 'stats' ? 'on' : ''}">My stats</button><button data-tab="leads" class="${view.tab === 'leads' ? 'on' : ''}">My leads <b>${(page.myLeads || []).length}</b></button>
      <button id="reload" aria-label="Refresh">↻</button><a class="calls" href="./calls.html?rep=1">Call list ›</a></nav>
    <div id="body"></div>
    <p class="meta">Updated ${esc(fmtDT(page.generatedAt))}. The office computer refreshes this through the day.</p>`;
  app.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => { view.tab = b.dataset.tab; save(K.tab, view.tab); render(); }));
  document.getElementById('reload').addEventListener('click', () => refresh(false));
  document.getElementById('out').addEventListener('click', e => { e.preventDefault(); ['dript_rep_code', 'dript_rep_page', 'dript_rep_calls', 'dript_rep_outbox'].forEach(k => localStorage.removeItem(k)); page = null; render(); });
  if (view.tab === 'leads') renderLeads(); else renderStats();
}

// The review site's own Stats page for this rep, one copy per day; its day and month links come back here.
function days() { return Object.keys(page.stats || {}).sort(); }
function pickDay(d) {
  const all = days();
  if (!all.length) return;
  if (!all.includes(d)) {
    const inMonth = all.filter(x => x.slice(0, 7) === d.slice(0, 7));
    d = inMonth.length ? (d < inMonth[0] ? inMonth[0] : inMonth[inMonth.length - 1]) : (d < all[0] ? all[0] : all[all.length - 1]);
    if (d.slice(0, 7) !== (view.day || '').slice(0, 7) && !inMonth.length) toast('Only this month and last month are here');
  }
  view.day = d;
  renderStats();
}
window.pickDay = pickDay;
function renderStats() {
  const body = document.getElementById('body');
  const all = days();
  if (!all.length) { body.innerHTML = '<div class="empty">No stats yet.</div>'; return; }
  const d = view.day && all.includes(view.day) ? view.day : (all.includes(page.today) ? page.today : all[all.length - 1]);
  view.day = d;
  const hook = `<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href^="#d="]');if(!a)return;e.preventDefault();parent.pickDay(a.getAttribute('href').slice(3));});<\/script>`;
  const html = `<!doctype html><html lang="en"><head><meta charset="utf-8"><style>${page.statsCss || ''}body{background:transparent}</style></head><body><main class="wrap">${page.stats[d]}</main>${hook}</body></html>`;
  body.innerHTML = '<iframe id="stats" title="My stats"></iframe>';
  const f = document.getElementById('stats');
  const fit = () => { try { f.style.height = f.contentDocument.documentElement.scrollHeight + 'px'; } catch {} };
  f.addEventListener('load', () => { fit(); try { new ResizeObserver(fit).observe(f.contentDocument.body); } catch {} });
  f.srcdoc = html;
}

const STAGES = [['', 'Every lead'], ['open', 'Still quoting'], ['todo', 'Needs a look'], ['booked', 'Booked'], ['done', 'Done'], ['lost', 'Lost / cancelled']];
function renderLeads() {
  const body = document.getElementById('body');
  const leads = page.myLeads || [];
  const n = k => leads.filter(l => l.key === k).length;
  const sum = k => leads.filter(l => l.key === k).reduce((t, l) => t + (l.total || 0), 0);
  body.innerHTML = `
    <div class="counts">
      <div class="k"><b>${n('open')}</b><span>still quoting · ${money(sum('open'))}</span></div>
      <div class="k"><b>${n('booked') + n('todo')}</b><span>booked · ${money(sum('booked') + sum('todo'))}</span></div>
      <div class="k"><b>${n('done')}</b><span>done · ${money(sum('done'))}</span></div>
      <div class="k"><b>${n('lost')}</b><span>lost / cancelled</span></div>
    </div>
    <div class="bar"><input id="q" type="search" placeholder="Search name or address" value="${esc(view.q)}">
      <select id="st">${STAGES.map(([v, s]) => `<option value="${v}" ${view.st === v ? 'selected' : ''}>${s}${v ? ' (' + n(v) + ')' : ''}</option>`).join('')}</select></div>
    <div class="rows" id="rows"></div>`;
  const draw = () => {
    const q = view.q.toLowerCase();
    const list = leads.filter(l => (!view.st || l.key === view.st) && (!q || (l.name + ' ' + l.address + ' ' + (l.job || '')).toLowerCase().includes(q)));
    document.getElementById('rows').innerHTML = list.length ? list.map(l => `<div class="row">
      <div class="d">${esc(fmt(l.date))}</div>
      <div><div class="n">${esc(l.name || '—')}</div><div class="a">${esc(l.address)}</div><span class="tag ${esc(l.tone)}">${esc(l.stage)}</span></div>
      <div class="r"><div class="p">${money(l.total)}</div><div class="d">${l.job ? '#' + esc(l.job) : ''}</div></div></div>`).join('') : '<div class="empty">No leads here</div>';
  };
  document.getElementById('q').addEventListener('input', e => { view.q = e.target.value; draw(); });
  document.getElementById('st').addEventListener('change', e => { view.st = e.target.value; draw(); });
  draw();
}

render();
refresh(!!page);
</script>
</body>
</html>
